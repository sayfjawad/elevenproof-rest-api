name: Build, Test, Push to GHCR and deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test
        run: mvn clean verify

      - name: Build and Push Docker Image with Jib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/elevenproof-rest-api:${{ github.sha }}
          mvn -B package jib:build \
            -Djib.to.image=$IMAGE_ID \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KUBECONFIG_CONTENTS: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_CONTENTS" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/elevenproof-rest-api:${{ github.sha }}
          kubectl apply -f kubernetes/elevenproof-deployment.yaml
          kubectl apply -f kubernetes/elevenproof-service.yaml
          kubectl apply -f kubernetes/elevenproof-ingress.yaml
          kubectl set image deployment/elevenproof-deployment elevenproof=$IMAGE_ID
          kubectl rollout status deployment/elevenproof-deployment
