name: Build, Test, Push to GHCR and deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test
        run: mvn clean verify

      # Deploy is GitOps (Flux, in-cluster) from here on: this step only builds and pushes the
      # image. Flux's image-automation-controller watches GHCR for new main-<run_number> tags
      # and commits the update into github.com/sayfjawad/multicode-infra itself — no cluster
      # access needed from this workflow at all.
      - name: Build and Push Docker Image with Jib
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mvn -B package jib:build \
            -Djib.to.image=ghcr.io/${{ github.repository_owner }}/elevenproof-rest-api:${{ github.sha }} \
            -Djib.to.tags=main-${{ github.run_number }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
