apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elevenproof-ingress
  annotations:
    # Assumes cert-manager is installed on the cluster with a ClusterIssuer
    # named "letsencrypt-prod" (see kubernetes/cluster-setup/cluster-issuer.yaml
    # for a starting point if that isn't the case yet).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eleven.multicode.nl
      secretName: eleven-multicode-nl-tls
  rules:
    - host: eleven.multicode.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elevenproof-service
                port:
                  number: 8080
