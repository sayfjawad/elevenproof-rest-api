# One-time, cluster-wide prerequisite for kubernetes/elevenproof-ingress.yaml.
# Only needed if cert-manager + a Let's Encrypt ClusterIssuer aren't already
# configured on the k3s cluster. Apply once per cluster, not per app:
#
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   kubectl apply -f kubernetes/cluster-setup/cluster-issuer.yaml
#
# k3s ships Traefik as the default ingress controller, so no extra ingress
# controller install should be needed — only cert-manager itself.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sayf@multicode.nl
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
